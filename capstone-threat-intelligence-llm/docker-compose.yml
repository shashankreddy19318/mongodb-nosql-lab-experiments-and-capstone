version: "3.8"

services:
  mongo:
    image: mongo:7.0
    container_name: threat-intel-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: threat_intelligence_db
    volumes:
      - mongo_data:/data/db
    networks:
      - threat-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: shashankreddy19318/threat-intel-app:latest
    container_name: threat-intel-backend
    restart: unless-stopped
    command: ["api"]
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/?directConnection=true
      - MONGO_DB=threat_intelligence_db
      - LLM_BACKEND=local_slm
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - threat-network

  vulnerability-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: shashankreddy19318/threat-intel-app:latest
    container_name: threat-intel-bot
    restart: unless-stopped
    command: ["bot"]
    environment:
      - MONGO_URI=mongodb://mongo:27017/?directConnection=true
      - MONGO_DB=threat_intelligence_db
      - BOT_SCAN_INTERVAL=60
    depends_on:
      backend:
        condition: service_started
    networks:
      - threat-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: shashankreddy19318/threat-intel-app:latest
    container_name: threat-intel-frontend
    restart: unless-stopped
    command: ["streamlit"]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_started
    networks:
      - threat-network

networks:
  threat-network:
    driver: bridge

volumes:
  mongo_data:
