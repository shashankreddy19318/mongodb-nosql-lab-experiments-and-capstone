services:
  mongo-rs0-1:
    image: mongo:7
    container_name: mongo-rs0-1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - rs0_data1:/data/db
    networks:
      mongo-net:
        aliases:
          - mongo-rs0-1
    healthcheck:
      test: echo 'db.runCommand({ping:1})' | mongosh --quiet
      interval: 5s
      timeout: 3s
      retries: 5

  mongo-rs0-2:
    image: mongo:7
    container_name: mongo-rs0-2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - rs0_data2:/data/db
    networks:
      mongo-net:
        aliases:
          - mongo-rs0-2

  mongo-rs0-3:
    image: mongo:7
    container_name: mongo-rs0-3
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27019"]
    ports:
      - "27019:27019"
    volumes:
      - rs0_data3:/data/db
    networks:
      mongo-net:
        aliases:
          - mongo-rs0-3

  lab09-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: mongodb-lab09:latest
    container_name: mongodb-lab09-runner
    depends_on:
      - mongo-rs0-1
      - mongo-rs0-2
      - mongo-rs0-3
    environment:
      - MONGO_URI=mongodb://mongo-rs0-1:27017/?directConnection=true
      - DOCKER_NETWORK=mongo-net
      - SEC1_CONTAINER=mongo-rs0-2
      - SEC2_CONTAINER=mongo-rs0-3
      - PRIMARY_CONTAINER=mongo-rs0-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mongo-net
    command: ["demo"]

networks:
  mongo-net:
    name: mongo-net

volumes:
  rs0_data1:
  rs0_data2:
  rs0_data3:
