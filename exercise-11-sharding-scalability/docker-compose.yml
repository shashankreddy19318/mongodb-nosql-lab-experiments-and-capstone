services:
  # ----------------------------------------------------------------------------
  # 1. Config Server Replica Set (1 node configReplSet)
  # ----------------------------------------------------------------------------
  mongo-config:
    image: mongo:7
    container_name: mongo-config
    command: ["mongod", "--configsvr", "--replSet", "configReplSet", "--port", "27019", "--bind_ip_all"]
    ports:
      - "27019:27019"
    volumes:
      - config_data:/data/db
    networks:
      shard-net:
        aliases:
          - mongo-config
    healthcheck:
      test: echo 'db.runCommand({ping:1})' | mongosh --port 27019 --quiet
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Shard 1 Replica Set (shard1rs)
  # ----------------------------------------------------------------------------
  mongo-shard1:
    image: mongo:7
    container_name: mongo-shard1
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--port", "27018", "--bind_ip_all"]
    ports:
      - "27018:27018"
    volumes:
      - shard1_data:/data/db
    networks:
      shard-net:
        aliases:
          - mongo-shard1
    healthcheck:
      test: echo 'db.runCommand({ping:1})' | mongosh --port 27018 --quiet
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Shard 2 Replica Set (shard2rs)
  # ----------------------------------------------------------------------------
  mongo-shard2:
    image: mongo:7
    container_name: mongo-shard2
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--port", "27020", "--bind_ip_all"]
    ports:
      - "27020:27020"
    volumes:
      - shard2_data:/data/db
    networks:
      shard-net:
        aliases:
          - mongo-shard2
    healthcheck:
      test: echo 'db.runCommand({ping:1})' | mongosh --port 27020 --quiet
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. Mongos Query Router
  # ----------------------------------------------------------------------------
  mongos-router:
    image: mongo:7
    container_name: mongos-router
    depends_on:
      mongo-config:
        condition: service_healthy
    command: ["mongos", "--configdb", "configReplSet/mongo-config:27019", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27017:27017"
    networks:
      shard-net:
        aliases:
          - mongos-router
    healthcheck:
      test: echo 'db.runCommand({ping:1})' | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------------------------
  # 5. Cluster Initializer
  # ----------------------------------------------------------------------------
  cluster-init:
    image: mongo:7
    container_name: mongo-cluster-init
    depends_on:
      mongo-config:
        condition: service_healthy
      mongo-shard1:
        condition: service_healthy
      mongo-shard2:
        condition: service_healthy
      mongos-router:
        condition: service_healthy
    networks:
      - shard-net
    restart: "no"
    entrypoint: >
      bash -c "
      echo 'Initializing Config Server Replica Set...';
      mongosh --host mongo-config:27019 --eval '
        try {
          rs.status();
        } catch(e) {
          rs.initiate({ _id: \"configReplSet\", configsvr: true, members: [{ _id: 0, host: \"mongo-config:27019\" }] });
        }
      ';
      sleep 2;
      echo 'Initializing Shard 1 Replica Set...';
      mongosh --host mongo-shard1:27018 --eval '
        try {
          rs.status();
        } catch(e) {
          rs.initiate({ _id: \"shard1rs\", members: [{ _id: 0, host: \"mongo-shard1:27018\" }] });
        }
      ';
      sleep 2;
      echo 'Initializing Shard 2 Replica Set...';
      mongosh --host mongo-shard2:27020 --eval '
        try {
          rs.status();
        } catch(e) {
          rs.initiate({ _id: \"shard2rs\", members: [{ _id: 0, host: \"mongo-shard2:27020\" }] });
        }
      ';
      sleep 3;
      echo 'Registering Shards with Mongos Router...';
      mongosh --host mongos-router:27017 --eval '
        try {
          sh.addShard(\"shard1rs/mongo-shard1:27018\");
          sh.addShard(\"shard2rs/mongo-shard2:27020\");
          sh.enableSharding(\"ecommerce_sharding\");
          print(\"[OK] Sharded cluster registered successfully:\");
          printjson(sh.status());
        } catch(e) {
          print(\"[INFO] AddShard error or already added: \" + e);
        }
      ';
      echo '[OK] MongoDB Sharded Cluster Initialization Complete!';
      "

  # ----------------------------------------------------------------------------
  # 6. Lab 11 Demonstration Runner
  # ----------------------------------------------------------------------------
  lab11-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: chintan/mongodb-lab11:latest
    container_name: mongodb-lab11-runner
    depends_on:
      - cluster-init
    environment:
      - MONGO_URI=mongodb://mongos-router:27017
      - MONGO_DB=ecommerce_sharding
    networks:
      - shard-net
    command: ["demo"]

networks:
  shard-net:
    name: mongo-shard-net
    external: false

volumes:
  config_data:
  shard1_data:
  shard2_data:
