apiVersion: v1
kind: Pod
metadata:
  name: mongo-client
  namespace: nosql-labs
  labels:
    app: mongo-client
spec:
  containers:
    - name: mongo-client
      image: mongo:7.0
      command: ["sleep", "infinity"]
      env:
        - name: MONGO_URI
          value: "mongodb://mongo-0.mongo-headless-svc.nosql-labs.svc.cluster.local:27017,mongo-1.mongo-headless-svc.nosql-labs.svc.cluster.local:27017,mongo-2.mongo-headless-svc.nosql-labs.svc.cluster.local:27017/?replicaSet=rs0"
